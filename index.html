<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrueMax — Facial Analysis</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%231b1b19%22/><text x=%2250%22 y=%2268%22 font-size=%2252%22 font-family=%22sans-serif%22 font-weight=%22700%22 fill=%22white%22 text-anchor=%22middle%22>T</text></svg>" />
    <link rel="preload" href="/models/face_landmarker.task" as="fetch" crossorigin="anonymous" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <span class="wordmark">TrueMax</span>
        <span class="topbar-note">Front-face analysis · v1</span>
      </header>

      <!-- Screen 1: capture / upload -->
      <section id="screen-capture" class="screen">
        <div class="capture-inner">
          <h1 class="headline">Facial analysis,<br />with the math shown.</h1>
          <p class="subhead">
            Upload a clear, front-facing photo. Everything runs in your browser —
            the photo never leaves your device.
          </p>

          <div class="sex-picker" role="radiogroup" aria-label="Reference distribution">
            <span class="sex-picker-label">Score against</span>
            <div class="sex-picker-options">
              <button class="sex-option selected" data-sex="male" role="radio" aria-checked="true">Male norms</button>
              <button class="sex-option" data-sex="female" role="radio" aria-checked="false">Female norms</button>
            </div>
          </div>

          <label class="upload-zone" id="upload-zone">
            <input type="file" id="file-input" accept="image/*" hidden />
            <div class="upload-zone-inner">
              <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="17 8 12 3 7 8" />
                <line x1="12" y1="3" x2="12" y2="15" />
              </svg>
              <span class="upload-zone-title">Upload a photo</span>
              <span class="upload-zone-hint">Look straight ahead · good lighting · nothing covering your face</span>
            </div>
          </label>

          <p class="engine-status" id="engine-status">Loading analysis engine…</p>
        </div>
      </section>

      <!-- Screen 2: photo + landmarks -->
      <section id="screen-detect" class="screen hidden">
        <div class="detect-inner">
          <div class="photo-stage" id="photo-stage">
            <canvas id="photo-canvas"></canvas>
            <canvas id="overlay-canvas"></canvas>
          </div>
          <div class="detect-panel">
            <div id="detect-status" class="detect-status"></div>
            <div id="quality-report" class="quality-report hidden"></div>
            <button id="btn-reset" class="btn-secondary hidden">Try another photo</button>
          </div>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
