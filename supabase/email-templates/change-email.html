<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Confirm your new TrueMax email</title></head>
  <body style="margin:0;padding:0;background:#f4f3ef;color:#1b1c20;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;">Confirm the new email address for your TrueMax account.</div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f4f3ef;"><tr><td align="center" style="padding:36px 16px;">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;background:#ffffff;border:1px solid #deddd7;border-radius:24px;overflow:hidden;">
        <tr><td style="padding:32px 34px 10px;"><div style="font-size:17px;line-height:1;font-weight:700;letter-spacing:5px;">TRUE<span style="color:#0b8a78;">MAX</span></div></td></tr>
        <tr><td style="padding:26px 34px 34px;">
          <p style="margin:0 0 12px;color:#0b8a78;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;">Account email</p>
          <h1 style="margin:0 0 16px;font-size:34px;line-height:1.12;font-weight:500;letter-spacing:-0.7px;">Confirm your new email</h1>
          <p style="margin:0 0 26px;color:#5f6269;font-size:16px;line-height:1.65;">Confirm the change from <strong style="color:#1b1c20;">{{ .Email }}</strong> to <strong style="color:#1b1c20;">{{ .NewEmail }}</strong>.</p>
          <table role="presentation" cellspacing="0" cellpadding="0" border="0"><tr><td bgcolor="#101114" style="border-radius:12px;"><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 22px;color:#ffffff;font-size:15px;font-weight:700;text-decoration:none;border-radius:12px;">Confirm new email</a></td></tr></table>
          <div style="height:1px;background:#e8e7e2;margin:30px 0 20px;"></div>
          <p style="margin:0;color:#868990;font-size:13px;line-height:1.6;">Didn’t request this change? Ignore this email. Your account address will stay unchanged.</p>
        </td></tr>
      </table>
    </td></tr></table>
  </body>
</html>
