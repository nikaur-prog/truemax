<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TrueMax Quick</title>
    <!-- Staff only, and no longer merely unlisted. Access requires a signed-in
         account carrying an `app_admins` row; everybody else is shown "Not
         found" and the interface never paints. See src/ui/quickGate.ts.

         The page still asks search engines to stay away, because the cheapest
         way to keep something private is for nobody to look for it — but that
         is now the second line of defence rather than the only one. -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#141518" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preload" href="/models/face_landmarker.task" as="fetch" crossorigin="anonymous" />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/quick.css" />
  </head>
  <body class="quick">
    <main class="q-wrap q-locked">
      <header class="q-top">
        <span class="wordmark">TRUE<b>MAX</b></span>
        <span class="tag">QUICK · FRONT ONLY</span>
      </header>

      <!-- The three pillars.
           This page stopped being one tool a while ago. It is a content
           pipeline with three distinct jobs, and each of them wants different
           things at the door — one photo, two photos, or no photos at all. A
           single capture screen that then asks what you meant is the wrong
           order: choosing first is what lets each flow ask for exactly what it
           needs and nothing else. -->
      <section id="q-pillars">
        <p class="q-pillars-lede">What are you making?</p>
        <div class="q-pillar-grid">
          <button class="q-pillar" data-mode="reel" type="button">
            <span class="q-pillar-kicker">01</span>
            <b>Reel Creator</b>
            <span class="q-pillar-what">Before &amp; after, scanned and cut together</span>
            <span class="q-pillar-needs">Two photos · up to six clips</span>
          </button>
          <button class="q-pillar" data-mode="analysis" type="button">
            <span class="q-pillar-kicker">02</span>
            <b>Full Analysis</b>
            <span class="q-pillar-what">The narrated walk down one face</span>
            <span class="q-pillar-needs">One photo</span>
          </button>
          <button class="q-pillar" data-mode="ai" type="button">
            <span class="q-pillar-kicker">03</span>
            <b>AI Model Reel</b>
            <span class="q-pillar-what">Describe someone, preview them, then film them</span>
            <span class="q-pillar-needs">No photos · a description</span>
          </button>
          <!-- Not a content pillar. It makes nothing to post — it is the tool
               that decides whether the other three are telling the truth, and
               it lives here because this is the page the person who does that
               work already has open. -->
          <button class="q-pillar q-pillar-tool" data-mode="calibrate" type="button">
            <span class="q-pillar-kicker">04</span>
            <b>Calibrate</b>
            <span class="q-pillar-what">Rate a face, then see what the engine said</span>
            <span class="q-pillar-needs">One photo · your honest number</span>
          </button>
        </div>
      </section>

      <!-- AI Model Reel: character setup.
           No photograph is taken here, so the capture section is not merely
           hidden behind a notice — it is a different screen entirely. A camera
           on a screen that will never use one is worse than an unfinished
           feature, because it tells somebody to do something that cannot
           help them. -->
      <section id="q-ai" class="hidden">
        <div class="q-modebar">
          <button type="button" class="linkish" id="q-ai-back">← All modes</button>
          <span class="q-modebar-name">AI Model Reel</span>
          <span class="q-modebar-step" id="q-ai-step">Describe your character</span>
        </div>
        <form id="q-ai-form" class="q-ai-form">
          <div class="q-ai-row">
            <label class="q-ai-field">
              <span>Name</span>
              <input type="text" id="q-ai-name" placeholder="Jess" maxlength="40" required />
              <small>Saved under this name so you can film them again.</small>
            </label>
            <fieldset class="q-ai-field q-ai-seg">
              <legend>Gender</legend>
              <div class="q-seg" id="q-ai-sex">
                <button type="button" data-v="female" class="on">Woman</button>
                <button type="button" data-v="male">Man</button>
              </div>
            </fieldset>
          </div>
          <label class="q-ai-field">
            <span>Describe them</span>
            <textarea id="q-ai-desc" rows="3" placeholder="Mid-twenties, brown hair, freckles, a bit of acne along the jaw" required></textarea>
            <small>Face first. Hair, skin, age, build — the things that stay the same between the two shots.</small>
          </label>
          <div class="q-ai-row">
            <label class="q-ai-field">
              <span>Before</span>
              <input type="number" id="q-ai-before" min="1" max="10" step="0.1" value="4.5" />
            </label>
            <label class="q-ai-field">
              <span>After</span>
              <input type="number" id="q-ai-after" min="1" max="10" step="0.1" value="7.5" />
            </label>
          </div>
          <!-- Said before the first generation rather than after a
               disappointing one: the numbers steer the prompt, they are not
               promises the scanner has agreed to. -->
          <p class="q-ai-note" id="q-ai-note"></p>
          <button type="submit" class="btn pri" id="q-ai-go">Generate the preview pair</button>
          <p class="q-ai-msg" id="q-ai-msg" role="status"></p>
        </form>
        <div class="q-ai-preview hidden" id="q-ai-preview"></div>
      </section>

      <!-- Capture -->
      <section id="q-capture" class="hidden">
        <div class="q-modebar">
          <button type="button" class="linkish" id="q-mode-back">← All modes</button>
          <span class="q-modebar-name" id="q-mode-name"></span>
          <span class="q-modebar-step" id="q-mode-step"></span>
        </div>
        <div class="q-frame" id="q-frame">
          <!-- Behind the video, visible only until the camera opens. A page
               built to be filmed should not open on a blank grey box. -->
          <canvas id="q-silhouette"></canvas>
          <video id="q-video" playsinline muted></video>
          <canvas id="q-guide"></canvas>
          <div class="q-hud">
            <div class="q-hint" id="q-hint">
              <b id="q-hint-title">Front photo</b>
              <span id="q-hint-detail">Eye-level, straight on · glasses, hats and hoods off</span>
            </div>
            <span class="lamp-track q-lamp"><i id="q-lamp-fill"></i></span>
          </div>
        </div>
        <div class="q-actions">
          <button class="btn pri" id="q-shoot">Use camera</button>
          <button class="btn gho" id="q-pick">Upload</button>
        </div>
        <p class="paste-hint" id="q-paste-hint" hidden></p>
        <input type="file" id="q-file" accept="image/*" hidden />
        <!-- Faces kept from previous sessions, so a take can be re-shot
             without finding and re-uploading the photograph again. Stays
             hidden until there is something in it — an empty strip on the
             capture screen is a permanent reminder of a feature you have not
             used. Filled by src/quick.ts. -->
        <section class="q-lib hidden" id="q-lib">
          <div class="q-lib-head">
            <span class="q-klabel">SAVED FACES</span>
            <button type="button" class="linkish" id="q-lib-clear">Clear all</button>
          </div>
          <div class="q-lib-strip" id="q-lib-strip"></div>
          <p class="q-lib-note">Kept on this device only, never uploaded. Tap one to load it without re-scanning.</p>
        </section>
        <p class="engine-status" id="q-engine">Loading analysis engine…</p>
      </section>

      <!-- Calibrate: the rating step and the set so far.
           Shown after a scan in calibrate mode, in place of the export row —
           there is nothing to export here, the output is a number a person
           types and the JSON the whole set becomes. -->
      <section id="q-cal" class="hidden">
        <div class="q-modebar">
          <button type="button" class="linkish" id="q-cal-back">← All modes</button>
          <span class="q-modebar-name">Calibrate</span>
          <span class="q-modebar-step" id="q-cal-step"></span>
        </div>
        <div id="q-cal-body"></div>
      </section>

      <!-- Result.
           Three stages play here rather than the card simply appearing: a scan
           line down the photo, then the landmark dots, then the photo shrinks to
           the top while the score cards drop out of it. It is built to be
           filmed — the point of this page is the fifteen seconds someone
           records, and a result that pops into existence has nothing to record. -->
      <section id="q-result" class="hidden">
        <div class="q-stage" id="q-stage">
          <div class="q-photo" id="q-photo">
            <canvas id="q-shot"></canvas>
            <canvas id="q-dots"></canvas>
            <div class="q-scanline" id="q-scanline"></div>
          </div>
          <div class="q-cards" id="q-cards"></div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/quick.ts"></script>
  </body>
</html>
