<!doctype html>
<html>
<!-- Offline renderer for CTA v2 (the Kurzgesagt cut). Driven by
     tools/build-cta2.mjs through window.__frame(t); never linked from the
     app. Same contract as the v1 harness: every frame is a pure function of
     t (src/ui/ctaSeries2.ts), so the master is identical on every build. -->
<head><meta charset="utf-8"></head>
<body style="margin:0;background:#0d1626">
<canvas id="out"></canvas>
<script type="module">
import "@fontsource-variable/fraunces";
import "@fontsource-variable/inter";
import { initLandmarker, detect, setRunningMode } from "/src/engine/landmarker.ts";
import { analyze } from "/src/engine/scoring.ts";
import { RECS } from "/src/engine/recommendations.ts";
import { renderScoreCard } from "/src/ui/scoreCard.ts";
import { buildPassPlan } from "/src/ui/measurePass.ts";
import { drawCta2Frame } from "/src/ui/ctaSeries2.ts";

const W = 1080;
const H = 1920;
const canvas = document.getElementById("out");
canvas.width = W;
canvas.height = H;
const ctx = canvas.getContext("2d");

const img = (src) => new Promise((res, rej) => {
  const i = new Image();
  i.onload = () => res(i);
  // Named, because the browser hands onerror a bare Event and the builder
  // prints it as "[object Event]" — which says a build failed but not that an
  // image is missing, let alone which one.
  i.onerror = () => rej(new Error("could not load image: " + src));
  i.src = src;
});

try {
  await Promise.all([
    document.fonts.load('300 64px "Fraunces Variable"'),
    document.fonts.load('500 26px "Inter Variable"'),
    document.fonts.ready,
  ]);

  const params = new URLSearchParams(location.search);
  const fs = (key) => params.get(key); // absolute /@fs/ URLs from the builder

  // One of the app's own synthetic demo portraits. This was a Wikimedia
  // photograph of a real person until that file was dropped from public/demo,
  // at which point every CTA build failed here with an image load error and
  // no build had succeeded since. A synthetic actor also takes the last real
  // face out of the advertisement.
  const face = await img("/demo/adrian.jpg");
  const photo = document.createElement("canvas");
  photo.width = face.naturalWidth;
  photo.height = face.naturalHeight;
  photo.getContext("2d").drawImage(face, 0, 0);

  await initLandmarker();
  await setRunningMode("IMAGE");
  const landmarks = detect(photo).faceLandmarks?.[0];
  if (!landmarks) throw new Error("no face detected in demo photo");
  const report = analyze(landmarks, photo.width, photo.height, "male", photo);

  const scoreCard = document.createElement("canvas");
  renderScoreCard(scoreCard, photo, landmarks, { report, caption: "DEMO SCAN" });

  // All the reliable constructions — the beat is fast, the breadth is the show.
  const metrics = buildPassPlan(report, null, { maxSteps: 8 }).map((s) => s.metric);

  const maxAvatar = await img("/brand/max-avatar.png").catch(() => null);
  const mark = await img("/brand/truemax-mark-512.png").catch(() => null);
  const actorBefore = await img(fs("before"));
  const actorAfter = await img(fs("after"));
  const linkbioPerson = fs("person") ? await img(fs("person")).catch(() => null) : null;

  // The products in the chat are the app's own acne-relevant topical recs,
  // verbatim, because the ad may only show recommendations the product gives.
  const byId = Object.fromEntries(RECS.map((r) => [r.id, r]));
  const products = ["adapalene", "spf", "emollient"]
    .map((id) => byId[id])
    .filter(Boolean)
    .map((r) => ({ title: r.title, what: r.what }));

  const assets = {
    scoreCard,
    photo,
    landmarks,
    metrics,
    credit: "AI-GENERATED DEMONSTRATION",
    maxAvatar,
    mark,
    girlFrame: () => null,
    recs: ["Daily sunscreen", "Zinc in food", "Consistent sleep timing"],
    actorBefore,
    actorAfter,
    linkbioPerson,
    // Measured once from the generated still: the blank screen's rect.
    linkbioScreen: { x: 0.437, y: 0.163, w: 0.372, h: 0.495, rot: 8 },
    products,
  };

  window.__frame = (t) => {
    drawCta2Frame(ctx, W, H, t, assets);
    return canvas.toDataURL("image/jpeg", 0.95);
  };
  window.__ready = true;
} catch (e) {
  window.__error = String(e && e.stack ? e.stack : e);
  window.__ready = "error";
}
</script>
</body>
</html>
