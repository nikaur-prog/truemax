<!doctype html><meta charset="utf-8"><body style="margin:0;background:#111">
<canvas id="c" width="720" height="1280"></canvas>
<script type="module">
import { drawRundownFrame } from "/src/ui/rundownFrame.ts";
import { buildTimeline } from "/src/engine/rundownTimeline.ts";
import { METRICS } from "/src/engine/metrics.ts";

// A stand-in photograph: a flat portrait with a face-shaped blob, enough for
// the crop maths to have a bounding box to work against.
const photo = document.createElement("canvas");
photo.width = 900; photo.height = 1200;
const p = photo.getContext("2d");
// A stand-in PORTRAIT, not a cut-out: a full-bleed rectangular photograph with
// a head-and-shoulders figure in it, because that is what a real scan is. The
// first version of this drew a bare ellipse on a flat field, and the ellipse
// read as though the renderer were masking the photo to an oval — which it
// never has. The harness should not invent a fault to look at.
const bg = p.createLinearGradient(0,0,0,1200);
bg.addColorStop(0,"#6b7d78"); bg.addColorStop(1,"#2c3a37");
p.fillStyle = bg; p.fillRect(0,0,900,1200);
p.fillStyle = "#2a3550"; p.beginPath(); p.ellipse(450,1120,330,330,0,0,7); p.fill(); // shoulders
p.fillStyle = "#c9a88a"; p.beginPath(); p.ellipse(450,760,86,110,0,0,7); p.fill();   // neck
p.fillStyle = "#d8b696"; p.beginPath(); p.ellipse(450,520,196,258,0,0,7); p.fill();  // head
p.fillStyle = "#3a2a20"; p.beginPath(); p.ellipse(450,330,200,120,0,0,7); p.fill();  // hair
p.fillStyle = "#2b2b2b";
p.beginPath(); p.ellipse(378,500,26,13,0,0,7); p.fill();
p.beginPath(); p.ellipse(522,500,26,13,0,0,7); p.fill();
p.strokeStyle = "#8a6a55"; p.lineWidth = 7;
p.beginPath(); p.arc(450,640,58,0.25,Math.PI-0.25); p.stroke();

// Landmarks spanning the blob.
//
// 468 of them, which is MediaPipe's full mesh size, because a measurement
// recipe indexes specific points by number — landmarks[EYE_R_INNER] and so on.
// At 60 the array simply had no entry there and every overlay silently drew
// nothing, which is why this harness could not see the animation it is most
// needed for. The geometry is a ring rather than a face, so the LINES it
// produces are nonsense; what is being checked here is the motion, not the
// anatomy, and for that a wrong line in the right place is enough.
const lm = [];
for (let i=0;i<468;i++){
  const a = (i/468)*Math.PI*2;
  lm.push({ x: (450+Math.cos(a)*180)/900, y: (520+Math.sin(a)*240)/1200, z: 0 });
}

const card = {
  // The LONGEST rung on the ladder, deliberately. At a fixed 76px this drew
  // as "ooksmaxxing final bos" — a fixture that only ever holds a short word
  // cannot catch that, so this one holds the worst case.
  verdict: "Great-looking", overall: 7.6, potential: 8.2, percentile: 92,
  rows: [
    { label: "Eyes", score: 8.1 }, { label: "Midface", score: 7.4 },
    { label: "Nose", score: 5.2 }, { label: "Lips", score: 4.3 },
    { label: "Jaw", score: 7.9 }, { label: "Chin", score: 6.8 },
    { label: "Proportions", score: 5.9 }, { label: "Symmetry", score: 7.1 },
  ],
};
// A cutaway: a visibly DIFFERENT photograph, so a frame showing it cannot be
// mistaken for the measured one at a glance.
const cut = document.createElement("canvas");
cut.width = 900; cut.height = 1200;
const c = cut.getContext("2d");
const cg = c.createLinearGradient(0,0,900,1200);
cg.addColorStop(0,"#7a3b2e"); cg.addColorStop(1,"#2b1410");
c.fillStyle = cg; c.fillRect(0,0,900,1200);
c.fillStyle = "#e8c9a8"; c.beginPath(); c.ellipse(430,560,210,270,0.12,0,7); c.fill();
c.fillStyle = "#fff"; c.font = "bold 90px sans-serif"; c.textAlign = "center";
c.fillText("CUTAWAY", 450, 1080);

const beats = [
  { kind: "metric", line: "Marlon has a canthal tilt of 6.4 degrees, so the outer corner sits above the inner.", metricId: "canthalTilt", region: "eyes", positive: true },
  // A second metric beat so the trait ledger's stacking — the previous entry
  // stepping back as the new one arrives — is visible in a still.
  { kind: "metric", line: "The jaw angle comes in wide, which costs him the lower third.", metricId: "jawFrontalAngle", region: "jaw", positive: false },
  { kind: "card", line: "The verdict: Great-looking. A very attractive male.", card },
  { kind: "card", line: "Marlon measures 7.6 out of 10.", card },
  // Two curve beats, because they render differently: the first carries a
  // badge and shows his standing, the second drops it and shows the crowd.
  { kind: "curve", line: "That's 1 in 10. Two thirds of men measure between 4.1 and 6.3.", percentile: 92, badge: "92th percentile" },
  { kind: "curve", line: "5.0 is the exact middle, and that shaded band is where most of them are.", percentile: 92 },
  { kind: "search", line: "Want yours analysed? truemax.app." },
];
// A REAL scored metric, so the overlay actually draws.
//
// This map was empty, which meant every metric beat rendered a bare
// photograph — so the harness could check the card, the curve and the search
// bar, and was silently blind to the one thing it is most needed for: the
// measurement animation. The def comes from the real table; only the scoring
// fields are fabricated, since the recipe reads geometry from the landmarks and
// nothing else.
const def = METRICS.find((m) => m.id === "canthalTilt");
const metrics = new Map();
if (def) {
  metrics.set(def.id, {
    def,
    value: 6.4,
    z: 1.1, zEff: 1.1, percentile: 86, markerPct: 86,
    score: 8.1, idealRange: [3, 9],
  });
}
const jawDef = METRICS.find((m) => m.id === "jawFrontalAngle");
if (jawDef) {
  metrics.set(jawDef.id, {
    def: jawDef,
    value: 104,
    z: -1.2, zEff: -1.2, percentile: 14, markerPct: 14,
    score: 3.9, idealRange: [86, 96],
  });
}

const timeline = buildTimeline(beats);
const overlayCanvas = document.createElement("canvas");
const ctx = document.getElementById("c").getContext("2d");
// Applied per draw, matching the exporter, so a stray restore cannot leave one
// frame at the wrong size.
const frame = (t) => {
  ctx.setTransform(window.k, 0, 0, window.k, 0, 0);
  drawRundownFrame(ctx, photo, lm, { timeline, metrics, name: "Marlon", broll: [{ image: cut }] }, t,
    { width: 720, height: 1280, overlayCanvas });
};

// Render at the real export size, through the same transform the exporter uses.
//
// rundownExport composites 1080x1920 by authoring at 720x1280 and scaling the
// context. That path had no way to be looked at — the harness drew at 720
// directly — so "the layout is unchanged, only the raster is bigger" was an
// argument rather than an observation. window.scale(1.5) makes it an
// observation.
window.scale = (k) => {
  const c = document.getElementById("c");
  c.width = Math.round(720 * k);
  c.height = Math.round(1280 * k);
  window.k = k;
  return true;
};
window.k = 1;

window.shot = (i) => {
  const b = timeline.beats[i];
  // Late in the beat, so any entrance animation has finished.
  const t = b.start + b.duration * 0.8;
  frame(t);
  return true;
};

// Draw beat i at an explicit fraction through its own duration, for checking
// what a beat looks like at a given moment rather than only near its end.
window.shotAt = (i, frac) => {
  const b = timeline.beats[i];
  frame(b.start + b.duration * frac);
  return true;
};
window.ready = true;
</script>
