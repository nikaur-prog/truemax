<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Account · TrueMax</title>
    <meta name="theme-color" content="#141518" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="auth-page">
    <header class="topbar">
      <a class="wordmark" href="/">TRUE<b>MAX</b></a>
      <a class="auth-scan-link" href="/">Scan your face →</a>
    </header>
    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="auth-title">
        <!-- The TrueMax mark, centred over the heading.
             This was an abstract oval with a line through it, floated left —
             neither the brand nor decoration, and unrecognisable as either.
             The portal is the one page reached cold from an email link, with
             no app around it to say what is being signed into, so it should
             open by saying its own name. Same caliper mark as the favicon and
             the app icon, drawn in the accent rather than reversed out of the
             dark tile, because this card is light. -->
        <div class="auth-mark" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none" role="img">
            <path d="M17 16h30M32 16v34" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
            <path d="M23 24c-5 4-6 13-3 19 2 4 5 7 9 9M41 24c5 4 6 13 3 19-2 4-5 7-9 9" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
            <circle cx="32" cy="32" r="2.5" fill="#F2C94C"/>
          </svg>
        </div>
        <div id="auth-root"><p class="acct-lede">Loading your account…</p></div>
      </section>
      <p class="auth-foot">Your face photos are processed on this device and are not sent to Supabase.</p>
    </main>
    <script type="module" src="/src/authPage.ts"></script>
  </body>
</html>
